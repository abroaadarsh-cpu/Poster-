<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery | Tahiri Digital Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08201b;--line:rgba(242,236,220,.14);--text:#f2ecdc;--muted:#a3bab1;--brass:#e0a93f;--brass-ink:#241707;
--font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f4f0e4;--line:rgba(8,32,27,.16);--text:#10231e;--muted:#4b625a;--brass:#9a6a0c;--brass-ink:#fff8e6}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:32px 18px 60px}
h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800}
.sub{color:var(--muted);margin:0 0 8px}
.back{display:inline-block;margin-bottom:18px;color:var(--brass);text-decoration:none;font-weight:600}
.grid{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.grid li{content-visibility:auto;contain-intrinsic-size:auto 260px}
.work{display:block;width:100%;height:100%;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.work img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.work span{display:block;padding:8px 10px;font-size:.85rem}
.slot{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--muted);font-size:.8rem;line-height:1.3;overflow-wrap:anywhere}
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:100vw;max-height:100vh;width:100%;height:100%}
dialog::backdrop{background:rgba(0,0,0,.88)}
.lb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;padding:16px}
.lb img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:10px}
.lb-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.lb-bar button{background:var(--brass);color:var(--brass-ink);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.lb-cap{color:#f2ecdc;text-align:center}
.order{background:var(--brass);color:var(--brass-ink);border-radius:20px;padding:32px 22px;margin-top:48px;text-align:center}
.order h2{margin:0 0 8px;font-size:clamp(1.4rem,3.5vw,2rem);font-weight:800}
.order p{margin:0 auto 18px;max-width:46ch;opacity:.9}
.order .num{display:block;font-size:1.3rem;font-weight:800;margin:0 0 18px;color:var(--brass-ink);text-decoration:none}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:700;text-decoration:none;border:1.5px solid var(--brass-ink);color:var(--brass-ink)}
.btn.primary{background:var(--brass-ink);color:var(--brass)}
.lb-bar a{background:var(--brass);color:var(--brass-ink);border-radius:999px;padding:10px 18px;font-weight:600;text-decoration:none}
.wa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:30;background:#25d366;color:#06330f;font-weight:800;text-decoration:none;border-radius:999px;padding:14px 20px;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
(function(){
  var dlg=document.getElementById('dlg'),big=document.getElementById('lbImg'),cap=document.getElementById('lbCap'),list=[],cur=0;
  function show(i){cur=(i+list.length)%list.length;big.src=list[cur].src;big.alt=list[cur].t;cap.textContent=list[cur].t;document.getElementById('orderThis').href='https://wa.me/923191285508?text='+encodeURIComponent('Assalam-o-Alaikum, I want a design like: '+list[cur].t)}
  [].slice.call(document.querySelectorAll('#grid li')).forEach(function(li){
    var im=li.querySelector('img'),link=(im.getAttribute('data-src')||'').trim(),t=im.getAttribute('alt')||'Design';
    if(!link||link==='new-images-here'){li.innerHTML='<div class="slot"></div>';li.firstChild.textContent='new-images-here';return;}
    li.innerHTML='<button type="button" class="work"><img loading="lazy" decoding="async"><span></span></button>';
    var n=li.querySelector('img');n.src=link;n.alt=t;li.querySelector('span').textContent=t;
    var item={src:link,t:t};list.push(item);
    li.querySelector('button').addEventListener('click',function(){
      show(list.indexOf(item));
      if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
    });
  });
  document.getElementById('prev').onclick=function(){show(cur-1)};
  document.getElementById('next').onclick=function(){show(cur+1)};
  document.getElementById('close').onclick=function(){dlg.close()};
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
  document.addEventListener('keydown',function(e){if(!dlg.open)return;
    if(e.key==='ArrowLeft')show(cur-1);else if(e.key==='ArrowRight')show(cur+1)});
})();
</script>
